# multibot: pytest silnika (engine/). Workflow ich harnessa (ci.yml) nietknięty.
name: engine
on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Install chromium
        run: python -m playwright install chromium --with-deps
      - name: Run pytest
        env:
          SLAFY_DATA_DIR: ${{ runner.temp }}/slafy-data
          HERMES_HOME: ${{ runner.temp }}/slafy-data
        run: python -m pytest -q --basetemp="${{ runner.temp }}/pytest"
