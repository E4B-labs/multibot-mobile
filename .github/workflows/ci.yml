name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: typecheck + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # the harness must stay portable Node — the windows leg is the
        # guardrail for the in-progress Windows port (POSIX-only tests
        # self-skip there)
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix webui
      - run: npm --prefix webui run typecheck
      - run: npm run test:webui
      - name: production WebView bundle
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run webui
          git diff --exit-code -- src/webui-html.ts
